app = "siakad-mysql"
primary_region = "sin"

[build]
  image = "edwinmalihu/mysql-siakad:0.0.1-amd64"

[env]
  MYSQL_ROOT_PASSWORD = "rootpass"
  MYSQL_DATABASE = "siakad_db"
  MYSQL_USER = "siakad_user"
  MYSQL_PASSWORD = "siakadpass"

[http_service]
  internal_port = 3306
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[volumes]]
  source = "mysql_data"
  destination = "/var/lib/mysql"
