      summary: List semesters
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Filter berdasarkan nama, kode, atau tahun ajaran
        - in: query
          name: academic_year_id
          schema:
            type: integer
            format: uint64
          description: Filter berdasarkan academic year
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filter berdasarkan status aktif
      responses:
        '200':
          description: Daftar semester
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterListResponse'
        '400':
          description: Parameter invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Master]
      summary: Buat semester baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterWriteRequest'
      responses:
        '201':
          description: Semester berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterDetailResponse'
        '400':
          description: Payload invalid atau academic year tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Kode semester sudah dipakai pada academic year yang sama
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/master/semesters/{id}:
    get:
      tags: [Master]
      summary: Detail semester
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Detail semester
          content:
