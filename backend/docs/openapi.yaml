components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    IDParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: uint64
      description: ID resource

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        service:
          type: string
        env:
          type: string
        db:
          type: string
          enum: [disabled, up, down]
        time:
          type: string
          format: date-time
      required: [success, service, env, db, time]

    APIIndexResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        modules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
            required: [name, path]
      required: [success, message, modules]

    ModuleHealthResponse:
      type: object
      properties:
        success:
          type: boolean
        module:
          type: string
        message:
          type: string
      required: [success, module, message]

    MasterHealthResponse:
      type: object
      properties:
        success:
          type: boolean
        module:
          type: string
        message:
          type: string
        db:
          type: boolean
      required: [success, module, message, db]

    ResourceListResponse:
      type: object
      properties:
        success:
          type: boolean
        module:
          type: string
        resources:
          type: array
          items:
            type: string
      required: [success, module, resources]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
      required: [success, error]

    AuthRole:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
          example: Administrator
        code:
          type: string
          example: admin
      required: [id, name, code]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        username:
          type: string
          example: admin
        email:
          type: string
          example: admin@siakad.local
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        full_name:
          type: string
          example: Administrator SIAKAD
        phone:
          type: string
          example: "081234567890"
        photo_url:
          type: string
          example: https://example.com/avatar.png
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AuthRole'
        role_codes:
          type: array
          items:
            type: string
            example: admin
      required: [id, username, is_active, roles, role_codes]

    AuthLoginRequest:
      type: object
      properties:
        identifier:
          type: string
          example: admin
          description: Bisa berupa username atau email
        username:
          type: string
          example: admin
          description: Alternatif lama, tetap didukung bila identifier kosong
        password:
          type: string
          example: Admin123!
      required: [password]

    AuthLoginResult:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
      required: [access_token, token_type, expires_at, user]

    AuthLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthLoginResult'
      required: [success, data]

    AuthMeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthUser'
      required: [success, data]

    NotImplementedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        module:
          type: string
        message:
          type: string
      required: [success, module, message]

    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
          example: 2027/2028
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - start_date
        - end_date
        - is_active
        - created_at
        - updated_at

    AcademicYearWriteRequest:
      type: object
      properties:
        name:
          type: string
          example: 2027/2028
        start_date:
          type: string
          format: date
          example: 2027-07-01
        end_date:
          type: string
          format: date
          example: 2028-06-30
        is_active:
          type: boolean
          example: true
      required: [name, start_date, end_date, is_active]

    AcademicYearListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AcademicYear'
        meta:
          type: object
          properties:
            total:
              type: integer
          required: [total]
      required: [success, data, meta]

    AcademicYearDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AcademicYear'
      required: [success, data]

    Class:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        academic_year_id:
          type: integer
          format: uint64
        academic_year_name:
          type: string
          example: 2027/2028
        department_id:
          type: integer
          format: uint64
        department_code:
          type: string
          example: RPL
        department_name:
          type: string
          example: Rekayasa Perangkat Lunak
        grade_level_id:
          type: integer
          format: uint64
        grade_level_code:
          type: string
          example: X
        grade_level_name:
          type: string
          example: Kelas 10
        name:
          type: string
          example: A
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - academic_year_id
        - academic_year_name
        - department_id
        - department_code
        - department_name
        - grade_level_id
        - grade_level_code
        - grade_level_name
        - name
        - is_active
        - created_at
        - updated_at

    ClassWriteRequest:
      type: object
      properties:
        academic_year_id:
          type: integer
          format: uint64
          example: 1
        department_id:
          type: integer
          format: uint64
          example: 1
        grade_level_id:
          type: integer
          format: uint64
          example: 1
