        '200':
          description: Hasil pencarian siswa lintas modul
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSearchListResponse'
        '400':
          description: Parameter invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/shared/student-search/{id}:
    get:
      tags: [Shared]
      summary: Student search detail
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Detail agregasi siswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSearchDetailResponse'
        '400':
          description: ID invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Siswa tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Shared]
      summary: Update announcement
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementWriteRequest'
      responses:
        '200':
          description: Pengumuman berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetailResponse'
        '400':
          description: Payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Shared]
      summary: Hapus announcement
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Pengumuman berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: ID invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/shared/resources:
    get:
      tags: [Shared]
      summary: Daftar resource shared
      responses:
        '200':
          description: Resource shared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    IDParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: uint64
      description: ID resource

  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        service:
          type: string
        env:
          type: string
        db:
          type: string
          enum: [disabled, up, down]
        time:
          type: string
          format: date-time
      required: [success, service, env, db, time]

    APIIndexResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        modules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
            required: [name, path]
      required: [success, message, modules]

    ModuleHealthResponse:
      type: object
      properties:
        success:
          type: boolean
        module:
          type: string
        message:
          type: string
      required: [success, module, message]

    MasterHealthResponse:
      type: object
      properties:
        success:
          type: boolean
        module:
          type: string
        message:
          type: string
        db:
          type: boolean
      required: [success, module, message, db]

    ResourceListResponse:
      type: object
      properties:
        success:
          type: boolean
        module:
          type: string
        resources:
          type: array
          items:
            type: string
      required: [success, module, resources]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
      required: [success, error]

    AuthRole:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
          example: Administrator
        code:
          type: string
          example: admin
      required: [id, name, code]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        username:
          type: string
          example: admin
        email:
          type: string
          example: admin@siakad.local
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        full_name:
          type: string
          example: Administrator SIAKAD
        phone:
          type: string
          example: "081234567890"
        photo_url:
          type: string
          example: https://example.com/avatar.png
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AuthRole'
        role_codes:
          type: array
          items:
            type: string
            example: admin
      required: [id, username, is_active, roles, role_codes]

    AuthLoginRequest:
      type: object
      properties:
        identifier:
          type: string
          example: admin
          description: Bisa berupa username atau email
        username:
          type: string
          example: admin
          description: Alternatif lama, tetap didukung bila identifier kosong
        password:
          type: string
          example: Admin123!
      required: [password]

    AuthLoginResult:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
      required: [access_token, token_type, expires_at, user]

    AuthLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthLoginResult'
      required: [success, data]

    AuthMeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthUser'
      required: [success, data]

    NotImplementedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        module:
          type: string
        message:
          type: string
      required: [success, module, message]

    DeleteResponse:
