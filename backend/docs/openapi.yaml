    post:
      tags: [Master]
      summary: Buat department baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentWriteRequest'
      responses:
        '201':
          description: Department berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetailResponse'
        '400':
          description: Payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Code atau name bentrok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/master/departments/{id}:
    get:
      tags: [Master]
      summary: Detail department
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Detail department
          content:
