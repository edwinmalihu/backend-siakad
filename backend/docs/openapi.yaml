openapi: 3.0.3
info:
  title: SIAKAD Backend API
  version: 0.1.0
  description: |
    Dokumentasi API awal untuk backend SIAKAD berbasis Go modular monolith.
    Versi ini mencakup endpoint health, discovery modul, serta CRUD `academic_years` dan `semesters`.
servers:
  - url: http://127.0.0.1:18080
    description: Local development
  - url: http://localhost:8080
    description: Default local server
tags:
  - name: System
  - name: Auth
  - name: Master
  - name: Student Affairs
  - name: Academic
  - name: Industry Relations
  - name: Shared
paths:
  /health:
    get:
      tags: [System]
      summary: Health check aplikasi
      responses:
        '200':
          description: Aplikasi sehat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database tidak tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1:
    get:
      tags: [System]
      summary: Daftar modul API yang tersedia
      responses:
        '200':
          description: Daftar modul
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIIndexResponse'

  /api/v1/auth/health:
    get:
      tags: [Auth]
      summary: Health check modul auth
      responses:
        '200':
          description: Modul auth siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleHealthResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login admin atau user aplikasi
      description: Menghasilkan bearer token untuk sesi frontend admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Request tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Username atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Akun tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Ambil profil user yang sedang login
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil user aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Token invalid atau kadaluarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Akun tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/master/health:
    get:
      tags: [Master]
      summary: Health check modul master
      responses:
        '200':
          description: Modul master siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterHealthResponse'

  /api/v1/master/reference-data:
    get:
      tags: [Master]
      summary: Daftar resource master
      responses:
        '200':
          description: Resource modul master
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'

  /api/v1/master/academic-years:
    get:
      tags: [Master]
      summary: List academic years
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Filter berdasarkan nama tahun ajaran
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filter berdasarkan status aktif
      responses:
        '200':
          description: Daftar tahun ajaran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearListResponse'
        '400':
          description: Parameter invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Master]
      summary: Buat academic year baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearWriteRequest'
      responses:
        '201':
          description: Tahun ajaran berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearDetailResponse'
        '400':
          description: Payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gagal membuat data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/master/academic-years/{id}:
    get:
      tags: [Master]
      summary: Detail academic year
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Detail tahun ajaran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearDetailResponse'
        '400':
          description: ID invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/master/classes:
    get:
      tags: [Master]
      summary: List classes
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Filter berdasarkan nama kelas atau nama relasi master
        - in: query
          name: academic_year_id
          schema:
            type: integer
            format: uint64
        - in: query
          name: department_id
          schema:
            type: integer
            format: uint64
        - in: query
          name: grade_level_id
          schema:
            type: integer
            format: uint64
        - in: query
          name: is_active
          schema:
            type: boolean
      responses:
        '200':
          description: Daftar class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassListResponse'
        '400':
          description: Parameter invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Master]
      summary: Buat class baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassWriteRequest'
      responses:
        '201':
          description: Class berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetailResponse'
        '400':
          description: Payload invalid atau relasi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Scope class bentrok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/master/classes/{id}:
    get:
      tags: [Master]
      summary: Detail class
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Detail class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetailResponse'
        '400':
          description: ID invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Master]
      summary: Update class
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassWriteRequest'
      responses:
        '200':
          description: Class berhasil diupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetailResponse'
        '400':
          description: Payload invalid atau relasi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Scope class bentrok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Master]
      summary: Soft delete class
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Class berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: ID invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Master]
      summary: Update academic year
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearWriteRequest'
      responses:
        '200':
          description: Tahun ajaran berhasil diupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearDetailResponse'
        '400':
          description: Payload atau ID invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Master]
      summary: Soft delete academic year
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Tahun ajaran berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: ID invalid
          content:
            application/json:
